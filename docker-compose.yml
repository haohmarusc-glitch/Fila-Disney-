services:
  fila-disney:
    build: .
    container_name: fila-disney
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./watchlist.json:/app/watchlist.json:ro
    logging:              # sem isso o log cresce sem limite no disco do VPS
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
