services:
  fila-disney:
    build:
      context: .
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    container_name: fila-disney
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./watchlist.json:/app/watchlist.json:ro
    logging:              # sem isso o log cresce sem limite no disco do VPS
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fila-disney-api:
    build:
      context: .
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    container_name: fila-disney-api
    command: ["python", "-u", "api_server.py"]
    restart: unless-stopped
    # Sobrescreve o HEALTHCHECK da imagem, que mede a coleta do monitor: aqui a
    # pergunta é se o servidor HTTP responde. Sem isto o container aparecia
    # "healthy" com a API morta.
    healthcheck:
      test: ["CMD", "python", "healthcheck_api.py"]
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./watchlist.json:/app/watchlist.json:ro
    networks:
      - default
      - premercado
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  premercado:
    external: true
    name: premercado_default
