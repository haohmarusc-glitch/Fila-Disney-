<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Fila Disney</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topo faixa">
    <div class="marca">
      <span class="marca-icone">🎢</span>
      <div>
        <h1>Fila Disney</h1>
        <p id="subtitulo" class="subtitulo">localizando…</p>
      </div>
    </div>
    <button id="atualizar" class="botao-atualizar" title="Atualizar agora">↻</button>
  </header>

  <nav class="barra-abas">
   <div class="abas faixa" role="tablist">
    <button class="aba ativa" data-aba="perto" role="tab">Melhores agora</button>
    <button class="aba" data-aba="parques" role="tab">Parques</button>
    <button class="aba" data-aba="roteiro" role="tab">Roteiro</button>
    <button class="aba" data-aba="vigias" role="tab">Vigias</button>
   </div>
  </nav>

  <main>
    <section id="painel-perto" class="painel faixa" role="tabpanel">
      <div id="perto-conteudo" class="conteudo">
        <p class="aviso">Permita o acesso à localização para ver o ranking do parque onde você está.</p>
      </div>
    </section>

    <section id="painel-parques" class="painel faixa oculto" role="tabpanel">
      <div id="parques-conteudo" class="conteudo"></div>
    </section>

    <section id="painel-roteiro" class="painel faixa oculto" role="tabpanel">
      <div id="roteiro-conteudo" class="conteudo"></div>
    </section>

    <section id="painel-vigias" class="painel faixa oculto" role="tabpanel">
      <div id="vigias-conteudo" class="conteudo"></div>
      <p class="nota">
        Para criar ou cancelar uma vigia, use o Telegram:
        <code>/vigiar everest 40</code> ou <code>/vigiar everest 50%</code>.
        O alerta chega no chat de quem criou.
      </p>
    </section>
  </main>

  <footer class="rodape faixa">
    <span id="atribuicao">Powered by Queue-Times.com</span>
    <span id="atualizado-em"></span>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
