name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # mesma do Dockerfile

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar watchlist.json
        run: python -c "import json; json.load(open('watchlist.json')); print('watchlist.json OK')"

      - name: Rodar testes
        run: python -m unittest discover -s tests -t . -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build --build-arg APP_GIT_SHA="$GITHUB_SHA" -t fila-disney:ci .

      # O build sozinho não pega módulo faltando no COPY: docker build não
      # importa nada. Foi assim que o localizacao.py chegou em produção fora da
      # imagem, com o CI verde e o container em loop de reinício.
      - name: Smoke test — a imagem consegue importar tudo?
        run: |
          docker run --rm fila-disney:ci python -c "
          import monitor, notifier, localizacao, coords, healthcheck, analyze
          assert monitor.APP_GIT_SHA == '$GITHUB_SHA'
          print('todos os módulos importam dentro da imagem')
          "

      - name: Smoke test — o healthcheck roda?
        run: |
          docker run --rm fila-disney:ci python healthcheck.py && echo inesperado || \
            echo "healthcheck retornou não-zero sem banco, como esperado"
